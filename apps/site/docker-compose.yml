services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ignai_payload
      POSTGRES_USER: ignai
      POSTGRES_PASSWORD: ignai
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ignai -d ignai_payload"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ignai_payload_postgres:/var/lib/postgresql/data

volumes:
  ignai_payload_postgres:
